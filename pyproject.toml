[project]
name = "port-scanner-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["rich", "typer"]

[project.scripts]
port-scan = "port_scanner.main:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
